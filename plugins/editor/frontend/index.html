<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Editor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --card-bg: #1e293b;
            --muted: #64748b;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* Tabs */
        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--card-bg);
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--muted);
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .tab:hover {
            color: var(--text-color);
        }

        .tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        /* Content Panels */
        .panel {
            flex: 1;
            display: none;
            padding: 16px;
            overflow: auto;
        }

        .panel.active {
            display: flex;
            flex-direction: column;
        }

        /* Journal */
        #journal-editor {
            flex: 1;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            color: var(--text-color);
            font-size: 0.9rem;
            line-height: 1.6;
            resize: none;
            outline: none;
        }

        #journal-editor::placeholder {
            color: var(--muted);
        }

        .status {
            padding: 8px;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
        }

        /* Briefing */
        #briefing-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            line-height: 1.8;
            white-space: pre-wrap;
        }

        #briefing-content h1 {
            font-size: 1.25rem;
            margin-bottom: 16px;
            color: var(--accent-color);
        }

        #briefing-content h2 {
            font-size: 1rem;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--muted);
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="tabs">
            <div class="tab active" data-tab="journal">📝 Journal</div>
            <div class="tab" data-tab="briefings">📊 Briefings</div>
        </div>

        <div id="journal-panel" class="panel active">
            <textarea 
                id="journal-editor" 
                placeholder="What did you accomplish today? Write your thoughts..."
            ></textarea>
            <div class="status" id="save-status">Ready</div>
        </div>

        <div id="briefings-panel" class="panel">
            <div id="briefing-content" class="empty-state">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p>No briefings yet. Check back after 8:00 AM!</p>
            </div>
        </div>
    </div>

    <script>
        // Tab Switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                
                tab.classList.add('active');
                document.getElementById(`${tab.dataset.tab}-panel`).classList.add('active');
            });
        });

        // Autosave with Debounce
        const editor = document.getElementById('journal-editor');
        const status = document.getElementById('save-status');
        let saveTimeout;

        function getToday() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        editor.addEventListener('input', () => {
            status.textContent = 'Typing...';
            clearTimeout(saveTimeout);
            
            saveTimeout = setTimeout(() => {
                // Send save request to shell via postMessage
                window.parent.postMessage({
                    type: 'RPC_REQUEST',
                    method: 'store.set',
                    params: [`journal_${getToday()}`, editor.value]
                }, '*');
                
                status.textContent = 'Saved ✓';
            }, 1000);
        });

        // Load initial content
        window.addEventListener('message', (event) => {
            if (event.data.type === 'RPC_RESPONSE' && event.data.method === 'store.get') {
                if (event.data.result) {
                    editor.value = event.data.result;
                }
            }
        });

        // Request initial journal content
        window.parent.postMessage({
            type: 'RPC_REQUEST',
            method: 'store.get',
            params: [`journal_${getToday()}`]
        }, '*');
    </script>
</body>
</html>
